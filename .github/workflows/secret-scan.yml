# Secret scanning: the working tree, every commit's content and message in
# the range, and the branch name, with gitleaks and the config held in the
# repository secret GITLEAKS_CONFIG_TOML. Output never includes matched text.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tree-and-commits:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: hack/secret-scan/install.sh
      - env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          hack/secret-scan/require-config.sh
          hack/secret-scan/tree.sh
          hack/secret-scan/range.sh "$BASE" "$HEAD"
          printf '%s' "$HEAD_REF" | hack/secret-scan/text.sh "branch name"

# Secret scanning of the working tree, every commit's content and message in
# the range, and the branch name, through release-checks' shared
# secret-scan.yml, with the gitleaks config held in the repository secret
# GITLEAKS_CONFIG_TOML. Output never includes matched text.
name: secret-scan
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The release-checks commit this workflow calls is one full SHA on
  # release-checks' main (.github/scripts/release-checks-ref.sh). It runs
  # first, with no `if:`, and the job that calls release-checks needs it.
  release-checks-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test
        run: .github/scripts/release-checks-ref.test.sh
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-checks-ref.sh

  secret-scan:
    needs: release-checks-ref
    uses: greghaskins/release-checks/.github/workflows/secret-scan.yml@908ba677391c1d39ad82a8e312016836bc68222f
    permissions:
      contents: read
    secrets:
      GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}

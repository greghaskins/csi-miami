# Secret scanning for text GitHub stores outside git (titles and bodies,
# reviews, comments, discussions), through release-checks' shared
# secret-scan-text.yml. A comment that matches is deleted; a matching title,
# body or release name is cleared and the run fails. The repository secrets
# GITLEAKS_CONFIG_TOML and TRUSTED_BOT_IDS are passed to it.
name: secret-scan-text
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
permissions: {}
jobs:
  # The release-checks commit this workflow calls is one full SHA on
  # release-checks' main (.github/scripts/release-checks-ref.sh). It runs
  # first, with no `if:`, and the job that calls release-checks needs it.
  release-checks-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test
        run: .github/scripts/release-checks-ref.test.sh
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-checks-ref.sh

  event-text:
    needs: release-checks-ref
    uses: greghaskins/release-checks/.github/workflows/secret-scan-text.yml@908ba677391c1d39ad82a8e312016836bc68222f
    permissions:
      contents: read
      issues: write
      pull-requests: write
      discussions: write
    secrets:
      GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
      TRUSTED_BOT_IDS: ${{ secrets.TRUSTED_BOT_IDS }}

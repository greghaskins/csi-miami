# Secret scanning for text GitHub stores outside git: issue and pull request
# titles and bodies, review bodies, comments, discussions and releases. A
# comment that matches is deleted; a title or body that matches is
# overwritten at once and the check fails. GitHub keeps the previous
# revision in the item's edit history, which only the web UI can delete, and
# a title change stays in the timeline; the placeholder text says so.
#
# pull_request_target runs with the base branch checked out and never
# executes anything from the pull request. Event text is read from the event
# file by hack/secret-scan/github-text.sh, never interpolated into a script.
name: secret-scan-text
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  release:
    types: [created, edited, published]
permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write
jobs:
  event-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: hack/secret-scan/install.sh
      - id: scan
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
        run: |
          hack/secret-scan/require-config.sh
          hack/secret-scan/github-text.sh
      - if: steps.scan.outputs.hit == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          KIND: ${{ steps.scan.outputs.kind }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const ev = context.payload;
            if (process.env.KIND === 'comment') {
              if (context.eventName === 'issue_comment') {
                await github.rest.issues.deleteComment({owner, repo, comment_id: ev.comment.id});
              } else if (context.eventName === 'pull_request_review_comment') {
                await github.rest.pulls.deleteReviewComment({owner, repo, comment_id: ev.comment.id});
              } else if (context.eventName === 'discussion_comment') {
                await github.graphql('mutation($id: ID!) { deleteDiscussionComment(input: {id: $id}) { clientMutationId } }',
                  {id: ev.comment.node_id});
              }
              core.setFailed('secret scanning removed a comment');
              return;
            }
            const title = 'Removed by secret scanning';
            const body = 'Secret scanning removed this text. Rewrite it, then delete the previous revision from the edit history (the "edited" menu).';
            if (context.eventName === 'pull_request_target') {
              await github.rest.pulls.update({owner, repo, pull_number: ev.pull_request.number, title, body});
            } else if (context.eventName === 'issues') {
              await github.rest.issues.update({owner, repo, issue_number: ev.issue.number, title, body});
            } else if (context.eventName === 'pull_request_review') {
              await github.rest.pulls.updateReview({owner, repo, pull_number: ev.pull_request.number, review_id: ev.review.id, body});
            } else if (context.eventName === 'release') {
              await github.rest.repos.updateRelease({owner, repo, release_id: ev.release.id, name: title, body});
            } else if (context.eventName === 'discussion') {
              await github.graphql('mutation($id: ID!, $title: String!, $body: String!) { updateDiscussion(input: {discussionId: $id, title: $title, body: $body}) { clientMutationId } }',
                {id: ev.discussion.node_id, title, body});
            }
            core.setFailed('secret scanning overwrote a title or body');

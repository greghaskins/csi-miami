# Secret scanning for text GitHub stores outside git: issue and pull request
# titles and bodies, review bodies, comments, discussions and releases. A
# comment that matches is deleted; a title or body that matches is
# overwritten at once and the check fails. GitHub keeps the previous
# revision in the item's edit history, which only the web UI can delete, and
# a title change stays in the timeline; the placeholder text says so.
#
# pull_request_target runs with the base branch checked out and never
# executes anything from the pull request. Event text is read from the event
# file by hack/secret-scan/github-text.sh, never interpolated into a script.
name: secret-scan-text
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  release:
    types: [created, edited, published]
permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write
jobs:
  event-text:
    # Text is scanned only when its author has write access to the repository
    # (admin, maintain or write); the removals therefore cannot be used by
    # anyone else to probe the private detector list. The author is whoever
    # wrote the item the event is about, and the gate step decides. GitHub
    # cannot report an installed app's permission from inside a workflow, so
    # bot accounts are scanned if and only if their numeric account ID is in
    # the owner-held secret TRUSTED_BOT_IDS; IDs are used rather than logins
    # because a login can change.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # repository secret: space-separated numeric account IDs of bot and
          # app accounts with write access whose text must be scanned; unset
          # or empty means none
          TRUSTED_BOT_IDS: ${{ secrets.TRUSTED_BOT_IDS }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            issue_comment|pull_request_review_comment|discussion_comment)
              q='.comment.user' ;;
            issues)              q='.issue.user' ;;
            pull_request_target) q='.pull_request.user' ;;
            pull_request_review) q='.review.user' ;;
            discussion)          q='.discussion.user' ;;
            release)             q='.release.author' ;;
            *) echo "gate: unhandled event $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          IFS=$'\t' read -r login id type < <(
            jq -r "$q | [(.login // \"-\"), (.id | tostring), (.type // \"-\")] | @tsv" \
              "$GITHUB_EVENT_PATH")
          if ! printf '%s\n' "$login" \
              | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\[bot\])?$'; then
            echo "gate: author login is not a valid account name" >&2
            exit 1
          fi
          if ! printf '%s\n' "$id" | grep -Eq '^[0-9]+$'; then
            echo "gate: author id for $login is not numeric" >&2
            exit 1
          fi
          if [[ $type == - ]]; then
            echo "gate: author type for $login is missing" >&2
            exit 1
          fi
          if [[ $type == Bot ]]; then
            if [[ $login != *'[bot]' ]]; then
              echo "gate: bot account $login does not end in [bot]" >&2
              exit 1
            fi
          elif [[ $login == *'[bot]' ]]; then
            echo "gate: non-bot account $login ends in [bot]" >&2
            exit 1
          fi
          scan=false
          if [[ $type == Bot ]]; then
            read -r -a ids <<<"${TRUSTED_BOT_IDS:-}"
            reason="bot id not in TRUSTED_BOT_IDS"
            for b in "${ids[@]}"; do
              if [[ $b == "$id" ]]; then
                scan=true
                reason="bot id listed in TRUSTED_BOT_IDS"
              fi
            done
          else
            err=$(mktemp)
            if perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" --jq .permission 2>"$err"); then
              reason="permission $perm"
              case "$perm" in admin|maintain|write) scan=true ;; esac
            elif grep -q 'HTTP 404' "$err"; then
              reason="not a collaborator (404)"
            else
              cat "$err" >&2
              echo "gate: could not determine permission for $login" >&2
              exit 1
            fi
          fi
          echo "gate: $login (id $id), $reason, scan=$scan"
          echo "scan=$scan" >>"$GITHUB_OUTPUT"
      - if: steps.gate.outputs.scan == 'true'
        run: hack/secret-scan/install.sh
      - if: steps.gate.outputs.scan == 'true'
        id: scan
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
        run: |
          hack/secret-scan/require-config.sh
          hack/secret-scan/github-text.sh
      - if: steps.gate.outputs.scan == 'true' && steps.scan.outputs.hit == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          KIND: ${{ steps.scan.outputs.kind }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const ev = context.payload;
            if (process.env.KIND === 'comment') {
              if (context.eventName === 'issue_comment') {
                await github.rest.issues.deleteComment({owner, repo, comment_id: ev.comment.id});
              } else if (context.eventName === 'pull_request_review_comment') {
                await github.rest.pulls.deleteReviewComment({owner, repo, comment_id: ev.comment.id});
              } else if (context.eventName === 'discussion_comment') {
                await github.graphql('mutation($id: ID!) { deleteDiscussionComment(input: {id: $id}) { clientMutationId } }',
                  {id: ev.comment.node_id});
              }
              core.setFailed('secret scanning removed a comment');
              return;
            }
            const title = 'Removed by secret scanning';
            const body = 'Secret scanning removed this text. Rewrite it, then delete the previous revision from the edit history (the "edited" menu).';
            if (context.eventName === 'pull_request_target') {
              await github.rest.pulls.update({owner, repo, pull_number: ev.pull_request.number, title, body});
            } else if (context.eventName === 'issues') {
              await github.rest.issues.update({owner, repo, issue_number: ev.issue.number, title, body});
            } else if (context.eventName === 'pull_request_review') {
              await github.rest.pulls.updateReview({owner, repo, pull_number: ev.pull_request.number, review_id: ev.review.id, body});
            } else if (context.eventName === 'release') {
              await github.rest.repos.updateRelease({owner, repo, release_id: ev.release.id, name: title, body});
            } else if (context.eventName === 'discussion') {
              await github.graphql('mutation($id: ID!, $title: String!, $body: String!) { updateDiscussion(input: {discussionId: $id, title: $title, body: $body}) { clientMutationId } }',
                {id: ev.discussion.node_id, title, body});
            }
            core.setFailed('secret scanning overwrote a title or body');

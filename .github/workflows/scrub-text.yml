# Scrub for text GitHub stores outside git: issue and pull request titles and
# bodies, review bodies, comments, discussions and releases. A comment that
# matches is deleted outright (editing would leave the original visible in
# its edit history); a title or body that matches fails this check and gets a
# one-line notice, since those can only be edited by their author.
#
# pull_request_target runs with the base branch checked out and never
# executes anything from the pull request. Event text is read from the event
# file by hack/scrub/github-text.sh, never interpolated into a script.
name: scrub-text
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  release:
    types: [created, edited, published]
permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write
jobs:
  event-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: hack/scrub/install.sh
      - id: scan
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
        run: |
          hack/scrub/require-config.sh
          hack/scrub/github-text.sh
      - if: steps.scan.outputs.hit == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          KIND: ${{ steps.scan.outputs.kind }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const ev = context.payload;
            const notice = 'The scrub check matched this text against the repository rule set.';
            if (process.env.KIND === 'comment') {
              if (context.eventName === 'issue_comment') {
                await github.rest.issues.deleteComment({owner, repo, comment_id: ev.comment.id});
              } else if (context.eventName === 'pull_request_review_comment') {
                await github.rest.pulls.deleteReviewComment({owner, repo, comment_id: ev.comment.id});
              } else if (context.eventName === 'discussion_comment') {
                await github.graphql('mutation($id: ID!) { deleteDiscussionComment(input: {id: $id}) { clientMutationId } }',
                  {id: ev.comment.node_id});
              }
              const number = (ev.issue || ev.pull_request || {}).number;
              if (number) {
                await github.rest.issues.createComment({owner, repo, issue_number: number,
                  body: notice + ' A comment was removed.'});
              }
              core.setFailed('comment removed');
            } else {
              const number = (ev.issue || ev.pull_request || {}).number;
              if (number) {
                await github.rest.issues.createComment({owner, repo, issue_number: number,
                  body: notice + ' Edit the title or body; this check fails until it passes.'});
              }
              core.setFailed('title or body must be edited');
            }

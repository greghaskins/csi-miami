# Continuous integration. Every job runs make targets or the scripts under
# hack/, so what passes locally is what passes here. `ci-ok` is the single
# required check: it fails if any job failed, was cancelled, or was skipped
# when it should have run.
#
# Images are content-addressed: they are tagged by hack/content-hash.sh, a
# hash of the build inputs (including hack/image-build.sh, which holds the
# build command), not by commit. A commit whose inputs are unchanged rebuilds
# nothing, and a push to main normally only adds its sha as an alias of the
# existing index. The registry is the artifact store, so this repository takes
# no fork pull requests (their token cannot push).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Pull request runs are superseded by the next push to the same ref. Runs on
# main are keyed by commit and never cancelled: each commit's alias must be
# created.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version comes from go.mod, which mise.toml pins to the same
      # release; the Makefile sets GOTOOLCHAIN=local so no other is used.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # golangci-lint is the official release binary at the exact version
      # mise.toml pins, so CI and `make lint` locally run the same binary.
      - name: Read the golangci-lint version from mise.toml
        id: lint
        run: |
          version="$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$version"
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint.outputs.version }}
          install-only: true
      - run: make fmt-check vet lint tidy-check vuln

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make cover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # The mount and observe packages against the real kernel, natively on each
  # architecture: hack/smoke.sh builds the smoke tests and runs them as root
  # under `unshare --mount --propagation private`, so nothing they mount
  # outlives or escapes them. sudo gets the pinned Go through PATH. A failing
  # run uploads the mountinfo lines for the test's own temporary paths.
  smoke:
    name: smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run the smoke tests as root
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke
        run: sudo -E env "PATH=$PATH" make smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-mountinfo-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/mountinfo.txt
          if-no-files-found: ignore

  # Builds and pushes x-<hash>-<arch> natively on each architecture (no
  # emulation) unless that tag already exists, then runs the image from the
  # registry, so every run proves the image that will be used starts, whether
  # or not this run built it. It records the digest of the image it ran, and
  # the index is created from exactly those digests.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the image identity
        id: id
        env:
          REPO: ${{ github.repository }}
        run: |
          hash="$(hack/content-hash.sh)"
          if ! [[ "$hash" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::unexpected content hash: '${hash}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            echo "hash=${hash}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push the image unless it exists
        env:
          IMAGE: ${{ steps.id.outputs.image }}
          HASH: ${{ steps.id.outputs.hash }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="${IMAGE}:x-${HASH}-${ARCH}"
          if hack/image-exists.sh "$tag"; then
            echo "$tag already exists; not rebuilding"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::could not tell whether $tag exists"
              exit "$status"
            fi
            echo "$tag does not exist; building"
            hack/image-build.sh --arch "$ARCH" --tag "$tag" --push
          fi
      - name: Run the image from the registry and record its digest
        env:
          IMAGE: ${{ steps.id.outputs.image }}
          HASH: ${{ steps.id.outputs.hash }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="${IMAGE}:x-${HASH}-${ARCH}"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" |
            jq -er --arg arch "$ARCH" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("expected exactly one linux/" + $arch + " manifest") end')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest: '${digest}'"
            exit 1
          fi
          got="$(docker run --rm "${IMAGE}@${digest}" version)"
          echo "${IMAGE}@${digest} (${tag}) reports version ${got}"
          test "$got" = "x-${HASH}"
          printf '%s\n' "$digest" > "digest-${ARCH}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          if-no-files-found: error

  # Creates the multi-arch index x-<hash> from exactly the two digests the
  # build legs ran, and verifies that it lists those and nothing else.
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.index.outputs.index_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the image identity
        id: id
        env:
          REPO: ${{ github.repository }}
        run: |
          hash="$(hack/content-hash.sh)"
          if ! [[ "$hash" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::unexpected content hash: '${hash}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            echo "hash=${hash}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Create and verify the index
        id: index
        env:
          IMAGE: ${{ steps.id.outputs.image }}
          HASH: ${{ steps.id.outputs.hash }}
        run: |
          amd64="$(cat digests/digest-amd64)"
          arm64="$(cat digests/digest-arm64)"
          for d in "$amd64" "$arm64"; do
            if ! [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest: '${d}'"
              exit 1
            fi
          done
          index="${IMAGE}:x-${HASH}"
          docker buildx imagetools create -t "$index" "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$index" |
            jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" '
              (.manifests | map({digest: .digest, platform: (.platform.os + "/" + .platform.architecture)})
                | sort_by(.platform))
              == [{digest: $amd64, platform: "linux/amd64"}, {digest: $arm64, platform: "linux/arm64"}]'
          index_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$index")"
          if ! [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected index digest: '${index_digest}'"
            exit 1
          fi
          echo "${index} is ${index_digest}, listing ${amd64} (amd64) and ${arm64} (arm64)"
          echo "index_digest=${index_digest}" >> "$GITHUB_OUTPUT"

  # On main only: add the commit sha as an alias of the index that this run's
  # manifest job created and verified. Idempotent, so a re-run or an
  # out-of-order main job is harmless.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Alias the commit sha to the verified index
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INDEX: ${{ needs.manifest.outputs.index_digest }}
        run: |
          if ! [[ "$INDEX" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected index digest: '${INDEX}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create -t "${image}:${SHA}" "${image}@${INDEX}"

  ci-ok:
    if: always()
    needs: [static, unit, smoke, build, manifest, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          SMOKE: ${{ needs.smoke.result }}
          BUILD: ${{ needs.build.result }}
          MANIFEST: ${{ needs.manifest.result }}
          PUBLISH: ${{ needs.publish.result }}
          PUBLISHING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          fail=0
          for pair in "static=$STATIC" "unit=$UNIT" "smoke=$SMOKE" "build=$BUILD" "manifest=$MANIFEST"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "::error::${pair%%=*} was ${pair#*=}, expected success"
              fail=1
            fi
          done
          # publish only runs when publishing from main; skipped is expected
          # everywhere else, and a failure to run it on main is a failure.
          if [ "$PUBLISHING" = "true" ]; then
            want="success"
          else
            want="skipped"
          fi
          if [ "$PUBLISH" != "$want" ]; then
            echo "::error::publish was $PUBLISH, expected $want"
            fail=1
          fi
          exit "$fail"

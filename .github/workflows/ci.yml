# Continuous integration. Every job runs make targets or the scripts under
# hack/, so what passes locally is what passes here. `ci-ok` is the single
# required check: it fails if any job failed, was cancelled, or was skipped
# when it should have run.
#
# The `changes` job decides whether the pull request touches anything but
# documentation (docs/, Markdown files, LICENSE). If it does not, the heavy
# jobs (envtest, sanity, smoke, e2e, e2e-kind, build, manifest, deploy) are
# skipped, and `ci-ok` accepts exactly those jobs as skipped; on any other
# change, and on every push to main, they must all have succeeded.
#
# Images are content-addressed: they are tagged by hack/content-hash.sh, a
# hash of the build inputs (including hack/image-build.sh, which holds the
# build command), not by commit. A commit whose inputs are unchanged rebuilds
# nothing, and a push to main normally only adds its sha as an alias of the
# existing index. The registry is the artifact store, so this repository takes
# no fork pull requests (their token cannot push).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Pull request runs are superseded by the next push to the same ref. Runs on
# main are keyed by commit and never cancelled: each commit's alias must be
# created.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Whether the change is more than documentation. Pull requests only: the
  # files the pull request changes (renames count both names) are listed from
  # the API, and the change is documentation only when every one is under
  # docs/, is a Markdown file or is LICENSE. A push to main, an empty list, or
  # a list the API may have cut short is "code", so the filter can only ever
  # run more, never less.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull request: everything runs"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          count="$(gh api "repos/${REPO}/pulls/${PR}" --jq '.changed_files')"
          code=false
          if [ -z "$files" ] || [ "$count" -ge 3000 ]; then
            code=true
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|*.md|LICENSE) echo "documentation: $f" ;;
              *) echo "code: $f"; code=true ;;
            esac
          done <<<"$files"
          echo "code=${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go version comes from go.mod, which mise.toml pins to the same
      # release; the Makefile sets GOTOOLCHAIN=local so no other is used.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # golangci-lint is the official release binary at the exact version
      # mise.toml pins, so CI and `make lint` locally run the same binary.
      - name: Read the golangci-lint version from mise.toml
        id: lint
        run: |
          version="$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$version"
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint.outputs.version }}
          install-only: true
      - run: make fmt-check vet lint tidy-check vuln

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make cover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # The controller's PV paths against a real kube-apiserver and etcd started by
  # envtest (build tag envtest, `make envtest`). setup-envtest is installed at
  # the version mise.toml pins; the Kubernetes version of the binaries it
  # downloads is pinned in the Makefile.
  envtest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install setup-envtest at the version mise.toml pins
        env:
          GOTOOLCHAIN: local
        run: |
          version="$(sed -n 's/^setup-envtest = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$version"
          GOBIN="${RUNNER_TEMP}/bin" go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@v${version}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - run: make envtest

  # csi-sanity (the version mise.toml pins) against the identity, controller
  # and node services on a local transport, with real bind mounts for the node
  # half, and the delete-path tests that mount real file systems and race
  # renames and mounts against the removal, as root under `unshare --mount
  # --propagation private` (hack/sanity.sh), natively on each architecture. The
  # output is uploaded when it fails.
  sanity:
    name: sanity (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install csi-sanity at the version mise.toml pins
        env:
          GOTOOLCHAIN: local
        run: |
          version="$(sed -n 's#^"go:github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity" = "\(.*\)"$#\1#p' mise.toml)"
          test -n "$version"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v${version}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Run csi-sanity as root
        run: sudo -E env "PATH=$PATH" make sanity 2>&1 | tee "${RUNNER_TEMP}/sanity.log"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sanity-log-${{ matrix.arch }}
          path: ${{ runner.temp }}/sanity.log
          if-no-files-found: ignore

  # The mount, observe, transport, reconcile and node-command packages against the real kernel,
  # natively on each architecture: hack/smoke.sh builds each package's smoke
  # tests and runs them as root under `unshare --mount --propagation
  # private`, so nothing they mount outlives or escapes them. sudo gets the pinned Go through PATH. A failing
  # run uploads the mountinfo lines for the test's own temporary paths.
  smoke:
    name: smoke (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run the smoke tests as root
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke
        run: sudo -E env "PATH=$PATH" make smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-mountinfo-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/mountinfo-*.txt
          if-no-files-found: ignore

  # A transport against a real server: hack/e2e.sh starts the kernel NFSv3
  # server of hack/nfs-server in a privileged container on the runner's docker
  # network and runs the nfs3 transport's end-to-end test as root under
  # `unshare --mount --propagation private`. This is the check that mount(2)
  # with the driver's option profile works on a real kernel with no helper
  # binary. If the runner cannot load nfsd the job fails with that message;
  # there is no user-space fallback. A failing run uploads the mountinfo lines
  # for the test's own paths and the server container's output.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (${{ matrix.transport }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: nfs3
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run the e2e test as root
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e
          TRANSPORT: ${{ matrix.transport }}
        run: sudo -E env "PATH=$PATH" make e2e E2E_TRANSPORT="$TRANSPORT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.transport }}
          path: ${{ runner.temp }}/e2e/
          if-no-files-found: ignore

  # Builds and pushes x-<hash>-<arch> natively on each architecture (no
  # emulation) unless that tag already exists, then runs the image from the
  # registry, so every run proves the image that will be used starts, whether
  # or not this run built it. It records the digest of the image it ran, and
  # the index is created from exactly those digests.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the image identity
        id: id
        env:
          REPO: ${{ github.repository }}
        run: |
          hash="$(hack/content-hash.sh)"
          if ! [[ "$hash" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::unexpected content hash: '${hash}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            echo "hash=${hash}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push the image unless it exists
        env:
          IMAGE: ${{ steps.id.outputs.image }}
          HASH: ${{ steps.id.outputs.hash }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="${IMAGE}:x-${HASH}-${ARCH}"
          if hack/image-exists.sh "$tag"; then
            echo "$tag already exists; not rebuilding"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::could not tell whether $tag exists"
              exit "$status"
            fi
            echo "$tag does not exist; building"
            hack/image-build.sh --arch "$ARCH" --tag "$tag" --push
          fi
      - name: Run the image from the registry and record its digest
        env:
          IMAGE: ${{ steps.id.outputs.image }}
          HASH: ${{ steps.id.outputs.hash }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="${IMAGE}:x-${HASH}-${ARCH}"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" |
            jq -er --arg arch "$ARCH" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("expected exactly one linux/" + $arch + " manifest") end')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest: '${digest}'"
            exit 1
          fi
          got="$(docker run --rm "${IMAGE}@${digest}" version)"
          echo "${IMAGE}@${digest} (${tag}) reports version ${got}"
          test "$got" = "x-${HASH}"
          printf '%s\n' "$digest" > "digest-${ARCH}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          if-no-files-found: error

  # Creates the multi-arch index x-<hash> from exactly the two digests the
  # build legs ran, and verifies that it lists those and nothing else.
  manifest:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.index.outputs.index_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the image identity
        id: id
        env:
          REPO: ${{ github.repository }}
        run: |
          hash="$(hack/content-hash.sh)"
          if ! [[ "$hash" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::unexpected content hash: '${hash}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            echo "hash=${hash}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Create and verify the index
        id: index
        env:
          IMAGE: ${{ steps.id.outputs.image }}
          HASH: ${{ steps.id.outputs.hash }}
        run: |
          amd64="$(cat digests/digest-amd64)"
          arm64="$(cat digests/digest-arm64)"
          for d in "$amd64" "$arm64"; do
            if ! [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest: '${d}'"
              exit 1
            fi
          done
          index="${IMAGE}:x-${HASH}"
          docker buildx imagetools create -t "$index" "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$index" |
            jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" '
              (.manifests | map({digest: .digest, platform: (.platform.os + "/" + .platform.architecture)})
                | sort_by(.platform))
              == [{digest: $amd64, platform: "linux/amd64"}, {digest: $arm64, platform: "linux/arm64"}]'
          index_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$index")"
          if ! [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected index digest: '${index_digest}'"
            exit 1
          fi
          echo "${index} is ${index_digest}, listing ${amd64} (amd64) and ${arm64} (arm64)"
          echo "index_digest=${index_digest}" >> "$GITHUB_OUTPUT"

  # The deploy check (hack/kind.sh): the e2e overlay on a kind cluster of one
  # control plane and two workers, with the amd64 image the build job pushed
  # (the content tag, pulled and loaded into the nodes, never pulled by them).
  # Passes when the node pod is Ready on each of the two workers and not on the
  # control plane, the driver is registered in every worker's CSINode and /healthz and /metrics answer through the API server. A
  # failing run uploads kind's logs, the pods' logs and descriptions and each
  # node's mountinfo. kind is built, and kubectl downloaded and checked against its
  # published checksum, at the versions mise.toml pins.
  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install kind and kubectl at the versions mise.toml pins
        run: |
          hack/install-kind-tools.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Pull the image the build job pushed
        id: image
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          hash="$(hack/content-hash.sh)"
          if ! [[ "$hash" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::unexpected content hash: '${hash}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]'):x-${hash}-amd64"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker pull "$image"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: Run the deploy check
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
          DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/deploy
        run: make deploy-check DEPLOY_IMAGE="$DEPLOY_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: deploy
          path: ${{ runner.temp }}/deploy/
          if-no-files-found: ignore

  # The driver on kind, end to end (hack/e2e-kind.sh, test/e2e): a cluster of
  # one control plane and two workers, the image the build job pushed for this
  # architecture (the content tag, pulled and loaded into the nodes, never
  # pulled by them), and exit criteria 1 to 6 of the plan as Go tests driven
  # through the API: two pods on two nodes share an nfs3 volume, a local volume
  # lives on one node, delete removes (nfs3) or leaves (local) the directory,
  # also across a controller restart, a node plugin restart changes nothing, a
  # node reboot (docker restart of a worker) loses nothing and leaks nothing,
  # and the metrics are served. For nfs3 the kernel NFSv3 server of
  # hack/nfs-server runs on the docker network of the kind nodes, and a
  # restart of that server (its export is a docker volume) is reported by the
  # node plugin and changes none of the mounts. A failing
  # run uploads what the tests dumped (driver logs, YAML, events, mountinfo),
  # the test output, kind's logs and the NFS server's output.
  e2e-kind:
    name: e2e-kind (${{ matrix.transport }}, ${{ matrix.arch }})
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: local
            arch: amd64
            runner: ubuntu-24.04
          - transport: nfs3
            arch: amd64
            runner: ubuntu-24.04
          - transport: nfs3
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install kind and kubectl at the versions mise.toml pins
        run: |
          hack/install-kind-tools.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Pull the image the build job pushed
        id: image
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
        run: |
          hash="$(hack/content-hash.sh)"
          if ! [[ "$hash" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::unexpected content hash: '${hash}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]'):x-${hash}-${ARCH}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker pull "$image"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: Run the kind end-to-end tests
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-kind
          TRANSPORT: ${{ matrix.transport }}
          E2E_IMAGE: ${{ steps.image.outputs.image }}
        run: sudo -E env "PATH=$PATH" make e2e E2E_MODE=kind E2E_TRANSPORT="$TRANSPORT" E2E_IMAGE="$E2E_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-kind-${{ matrix.transport }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/e2e-kind/
          if-no-files-found: ignore

  # On main only: add the commit sha as an alias of the index that this run's
  # manifest job created and verified. Idempotent, so a re-run or an
  # out-of-order main job is harmless.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Alias the commit sha to the verified index
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INDEX: ${{ needs.manifest.outputs.index_digest }}
        run: |
          if ! [[ "$INDEX" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected index digest: '${INDEX}'"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create -t "${image}:${SHA}" "${image}@${INDEX}"

  # The single required check. It runs even when a job it needs failed, was
  # cancelled or was skipped (if: always()), and passes only if:
  #
  #   - `changes` succeeded and said "true" or "false" (anything else, including
  #     a failure to decide, fails);
  #   - static and unit succeeded (they run on every change);
  #   - each filtered job (envtest, sanity, smoke, e2e, e2e-kind, build,
  #     manifest, deploy) succeeded when `changes` said "true" (code), so a job
  #     that was skipped, cancelled or failed on a code change fails here; and,
  #     when it said "false" (documentation only), is either skipped, which is
  #     what the filter does, or succeeded, but never failed or cancelled;
  #   - publish succeeded on a push to main and was skipped everywhere else.
  #
  # A filtered job therefore cannot stand in for a pass, and a pass cannot be
  # skipped on a code change.
  ci-ok:
    if: always()
    needs: [changes, static, unit, envtest, sanity, smoke, e2e, e2e-kind, build, manifest, deploy, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded, or to have been filtered out
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          ENVTEST: ${{ needs.envtest.result }}
          SANITY: ${{ needs.sanity.result }}
          SMOKE: ${{ needs.smoke.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_KIND: ${{ needs.e2e-kind.result }}
          BUILD: ${{ needs.build.result }}
          MANIFEST: ${{ needs.manifest.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PUBLISH: ${{ needs.publish.result }}
          PUBLISHING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          fail=0
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes was $CHANGES, expected success"
            fail=1
          fi
          if [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "::error::the change filter said '$CODE', expected true or false"
            fail=1
          fi
          # Jobs that run on every change.
          for pair in "static=$STATIC" "unit=$UNIT"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "::error::${pair%%=*} was ${pair#*=}, expected success"
              fail=1
            fi
          done
          # Jobs the filter may skip. On a code change (CODE is not "false", so
          # an undecided filter is a code change here) only success will do.
          for pair in "envtest=$ENVTEST" "sanity=$SANITY" "smoke=$SMOKE" "e2e=$E2E" "e2e-kind=$E2E_KIND" "build=$BUILD" "manifest=$MANIFEST" "deploy=$DEPLOY"; do
            result="${pair#*=}"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$CODE" = "false" ] && [ "$result" = "skipped" ]; then
              echo "${pair%%=*} was skipped: documentation-only change"
              continue
            fi
            echo "::error::${pair%%=*} was $result, expected success (the change filter said '$CODE')"
            fail=1
          done
          # publish only runs when publishing from main; skipped is expected
          # everywhere else, and a failure to run it on main is a failure.
          if [ "$PUBLISHING" = "true" ]; then
            want="success"
          else
            want="skipped"
          fi
          if [ "$PUBLISH" != "$want" ]; then
            echo "::error::publish was $PUBLISH, expected $want"
            fail=1
          fi
          exit "$fail"

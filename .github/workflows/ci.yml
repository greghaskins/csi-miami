# Continuous integration. Every job runs make targets (or the one docker
# command the Dockerfile needs), so what passes locally is what passes here.
# `ci-ok` is the single required check: it fails if any job failed, was
# cancelled, or was skipped when it should have run.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Go version comes from go.mod, which mise.toml pins to the same
      # release; the Makefile sets GOTOOLCHAIN=local so no other is used.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # golangci-lint is installed at the exact version mise.toml pins, so
      # CI and `make lint` locally run the same release.
      - name: Install golangci-lint
        env:
          GOTOOLCHAIN: local
        run: |
          version="$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$version"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make fmt-check vet lint tidy-check vuln

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make test-race GOTESTFLAGS="-covermode=atomic -coverprofile=coverage.out"
      - run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # packages: write is used only on pushes to main, to publish the
    # per-architecture images.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Each leg builds natively for its own architecture; there is no
      # emulation. The docker-container driver is needed for OCI output,
      # attestations and pushing.
      - name: Create builder
        run: docker buildx create --name ci --driver docker-container --use
      - name: Build and run the image
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --build-arg "VERSION=${{ github.sha }}" \
            --load -t "miami:ci" .
          test "$(docker run --rm miami:ci version)" = "${{ github.sha }}"
      - name: Export OCI archive
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --build-arg "VERSION=${{ github.sha }}" \
            --output "type=oci,dest=miami-${{ matrix.arch }}.tar" .
      - name: Upload OCI archive
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: miami-${{ matrix.arch }}.tar
          if-no-files-found: error
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --build-arg "VERSION=${{ github.sha }}" \
            --provenance=true --sbom=true \
            --push -t "${IMAGE}:${{ github.sha }}-${{ matrix.arch }}" .

  manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:main" \
            "${IMAGE}:${{ github.sha }}-amd64" \
            "${IMAGE}:${{ github.sha }}-arm64"

  ci-ok:
    if: always()
    needs: [static, unit, build, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          MANIFEST: ${{ needs.manifest.result }}
          PUBLISHING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          fail=0
          for pair in "static=$STATIC" "unit=$UNIT" "build=$BUILD"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "::error::${pair%%=*} was ${pair#*=}, expected success"
              fail=1
            fi
          done
          # manifest only runs when publishing from main; skipped is expected
          # everywhere else, and a failure to run it on main is a failure.
          if [ "$PUBLISHING" = "true" ]; then
            want="success"
          else
            want="skipped"
          fi
          if [ "$MANIFEST" != "$want" ]; then
            echo "::error::manifest was $MANIFEST, expected $want"
            fail=1
          fi
          exit "$fail"

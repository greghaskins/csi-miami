# Tool versions, pinned exactly. `mise install` also installs the git hooks.
[tools]
gitleaks = "8.30.1"
"pipx:pre-commit" = "4.7.0"

[hooks]
postinstall = "pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg"

# The scrub rule set is private and is NOT in this repository. Export
# GITLEAKS_CONFIG_TOML in your environment (README, Development); an [env]
# entry here that reads it from a secret store is the usual way.

# Tool versions, pinned exactly. `mise install` also installs the git hooks.
[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
gitleaks = "8.30.1"
setup-envtest = "0.25.2"
kind = "0.33.0"
kubectl = "1.37.2"
"go:github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity" = "5.6.0"
# Read by the secret-scan hooks (hack/secret-scan/range.sh).
jq = "1.8.2"
"pipx:pre-commit" = "4.7.0"

[hooks]
postinstall = "pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg --hook-type pre-push"

# The gitleaks config is kept outside this repository. Export
# GITLEAKS_CONFIG_TOML (or GITLEAKS_CONFIG_TOML_B64) in your environment (README, Development); an [env]
# entry here that reads it from a secret store is the usual way.

apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
  name: miami-system
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: miami.csi.greghaskins.com
spec:
  attachRequired: true
  fsGroupPolicy: ReadWriteOnceWithFSType
  podInfoOnMount: false
  requiresRepublish: false
  storageCapacity: false
  volumeLifecycleModes:
  - Persistent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miami-controller
  namespace: miami-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miami-node
  namespace: miami-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: miami-controller
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims/status
  verbs:
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - volumeattachments
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - volumeattachments/status
  verbs:
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - csinodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - list
  - watch
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: miami-node
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - patch
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: miami-node-capacity
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username.startsWith('system:serviceaccount:') &&
      request.userInfo.username.endsWith(':miami-node')
    name: node-plugin-only
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - nodes/status
  validations:
  - expression: has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name'
      in request.userInfo.extra && size(request.userInfo.extra['authentication.kubernetes.io/node-name'])
      == 1 && request.userInfo.extra['authentication.kubernetes.io/node-name'][0]
      == object.metadata.name
    message: '[node-name] the node plugin may update only the node its token is bound
      to'
    reason: Forbidden
  - expression: variables.newCap.all(k, k == variables.key || (k in variables.oldCap
      && variables.oldCap[k] == variables.newCap[k])) && variables.oldCap.all(k, k
      == variables.key || k == variables.probeKey || k in variables.newCap)
    message: '[capacity] the node plugin may change only the miami.csi.greghaskins.com/cache
      key of status.capacity'
    reason: Forbidden
  - expression: '(has(object.status.allocatable) ? has(oldObject.status.allocatable)
      && object.status.allocatable == oldObject.status.allocatable : !has(oldObject.status.allocatable))
      && (has(object.status.phase) ? has(oldObject.status.phase) && object.status.phase
      == oldObject.status.phase : !has(oldObject.status.phase)) && (has(object.status.conditions)
      ? has(oldObject.status.conditions) && object.status.conditions == oldObject.status.conditions
      : !has(oldObject.status.conditions)) && (has(object.status.addresses) ? has(oldObject.status.addresses)
      && object.status.addresses == oldObject.status.addresses : !has(oldObject.status.addresses))
      && (has(object.status.daemonEndpoints) ? has(oldObject.status.daemonEndpoints)
      && object.status.daemonEndpoints == oldObject.status.daemonEndpoints : !has(oldObject.status.daemonEndpoints))
      && (has(object.status.nodeInfo) ? has(oldObject.status.nodeInfo) && object.status.nodeInfo
      == oldObject.status.nodeInfo : !has(oldObject.status.nodeInfo)) && (has(object.status.images)
      ? has(oldObject.status.images) && object.status.images == oldObject.status.images
      : !has(oldObject.status.images)) && (has(object.status.volumesInUse) ? has(oldObject.status.volumesInUse)
      && object.status.volumesInUse == oldObject.status.volumesInUse : !has(oldObject.status.volumesInUse))
      && (has(object.status.volumesAttached) ? has(oldObject.status.volumesAttached)
      && object.status.volumesAttached == oldObject.status.volumesAttached : !has(oldObject.status.volumesAttached))
      && (has(object.status.config) ? has(oldObject.status.config) && object.status.config
      == oldObject.status.config : !has(oldObject.status.config)) && (has(object.status.runtimeHandlers)
      ? has(oldObject.status.runtimeHandlers) && object.status.runtimeHandlers ==
      oldObject.status.runtimeHandlers : !has(oldObject.status.runtimeHandlers)) &&
      (has(object.status.features) ? has(oldObject.status.features) && object.status.features
      == oldObject.status.features : !has(oldObject.status.features)) && (has(object.status.declaredFeatures)
      ? has(oldObject.status.declaredFeatures) && object.status.declaredFeatures ==
      oldObject.status.declaredFeatures : !has(oldObject.status.declaredFeatures))'
    message: '[status] the node plugin may not change any field of status but capacity'
    reason: Forbidden
  - expression: '(has(object.metadata.labels) ? has(oldObject.metadata.labels) &&
      object.metadata.labels == oldObject.metadata.labels : !has(oldObject.metadata.labels))
      && (has(object.metadata.annotations) ? has(oldObject.metadata.annotations) &&
      object.metadata.annotations == oldObject.metadata.annotations : !has(oldObject.metadata.annotations))
      && (has(object.metadata.finalizers) ? has(oldObject.metadata.finalizers) &&
      object.metadata.finalizers == oldObject.metadata.finalizers : !has(oldObject.metadata.finalizers))
      && (has(object.metadata.ownerReferences) ? has(oldObject.metadata.ownerReferences)
      && object.metadata.ownerReferences == oldObject.metadata.ownerReferences : !has(oldObject.metadata.ownerReferences))
      && (has(object.metadata.managedFields) ? object.metadata.managedFields.filter(e,
      e.operation == ''Apply'') : []) == (has(oldObject.metadata.managedFields) ?
      oldObject.metadata.managedFields.filter(e, e.operation == ''Apply'') : [])'
    message: '[metadata] the node plugin may not change labels, annotations, finalizers,
      ownerReferences or the Apply entries of managedFields'
    reason: Forbidden
  variables:
  - expression: '''miami.csi.greghaskins.com/cache'''
    name: key
  - expression: 'has(object.status.capacity) ? object.status.capacity : {}'
    name: newCap
  - expression: '''miami.csi.greghaskins.com/fence-probe'''
    name: probeKey
  - expression: 'has(oldObject.status.capacity) ? oldObject.status.capacity : {}'
    name: oldCap
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: miami-node-capacity
spec:
  policyName: miami-node-capacity
  validationActions:
  - Deny
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: miami-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: miami-controller
subjects:
- kind: ServiceAccount
  name: miami-controller
  namespace: miami-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miami-controller
  namespace: miami-system
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: miami-controller
  namespace: miami-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: miami-controller
subjects:
- kind: ServiceAccount
  name: miami-controller
  namespace: miami-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: miami-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: miami-node
subjects:
- kind: ServiceAccount
  name: miami-node
  namespace: miami-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miami-node
  namespace: default
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: miami-node
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: miami-node
subjects:
- kind: ServiceAccount
  name: miami-node
  namespace: miami-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miami-controller
  namespace: miami-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: miami
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: miami
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist
      automountServiceAccountToken: true
      containers:
      - args:
        - controller
        - --endpoint=unix:///csi/csi.sock
        - --transports-root=/var/lib/miami
        - --metrics-addr=:9811
        image: ghcr.io/greghaskins/csi-miami:unset
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9813
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
        name: miami
        ports:
        - containerPort: 9811
          name: metrics
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          appArmorProfile:
            type: Unconfined
          capabilities:
            add:
            - SYS_ADMIN
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /var/lib/miami
          name: transports
      - args:
        - --csi-address=/csi/csi.sock
        - --extra-create-metadata
        - --feature-gates=Topology=true
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --timeout=60s
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
        name: csi-provisioner
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0@sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
        name: csi-attacher
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --leader-election
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --resize-timeout=60s
        - --handle-volume-inuse-error=false
        - --feature-gates=VolumeAttributesClass=false
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: registry.k8s.io/sig-storage/csi-resizer:v2.3.0@sha256:48fb3deb93cd848e3c8998b6368f4322c93bb5ce4a90d1307b6dda0dbefb9a0e
        name: csi-resizer
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      - args:
        - --csi-address=/csi/csi.sock
        - --http-endpoint=:9813
        - --v=2
        image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
        name: livenessprobe
        ports:
        - containerPort: 9813
          name: healthz
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      serviceAccountName: miami-controller
      volumes:
      - emptyDir: {}
        name: socket-dir
      - emptyDir: {}
        name: transports
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: miami-node
  namespace: miami-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      app.kubernetes.io/name: miami
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node
        app.kubernetes.io/name: miami
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist
      automountServiceAccountToken: true
      containers:
      - args:
        - node
        - --endpoint=unix://$(KUBELET_DIR)/plugins/miami.csi.greghaskins.com/csi.sock
        - --node-id=$(NODE_NAME)
        - --kubelet-dir=$(KUBELET_DIR)
        - --metrics-addr=:9810
        env:
        - name: KUBELET_DIR
          value: /var/lib/kubelet
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: ghcr.io/greghaskins/csi-miami:unset
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9812
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
        name: miami
        ports:
        - containerPort: 9810
          name: metrics
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/kubelet
          mountPropagation: Bidirectional
          name: kubelet-dir
        - mountPath: /dev
          mountPropagation: HostToContainer
          name: host-dev
        - mountPath: /run/systemd
          name: host-run-systemd
          readOnly: true
        - mountPath: /sys
          name: host-sys
          readOnly: true
        - mountPath: /run/cryptsetup
          name: cryptsetup-lock
      - args:
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path=$(KUBELET_DIR)/plugins/miami.csi.greghaskins.com/csi.sock
        - --plugin-registration-path=/registration
        - --v=2
        env:
        - name: KUBELET_DIR
          value: /var/lib/kubelet
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
        name: csi-node-driver-registrar
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /csi
          name: kubelet-dir
          subPath: plugins/miami.csi.greghaskins.com
        - mountPath: /registration
          name: kubelet-dir
          subPath: plugins_registry
      - args:
        - --csi-address=/csi/csi.sock
        - --http-endpoint=:9812
        - --v=2
        image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
        name: livenessprobe
        ports:
        - containerPort: 9812
          name: healthz
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /csi
          name: kubelet-dir
          subPath: plugins/miami.csi.greghaskins.com
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: miami-node
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet
          type: Directory
        name: kubelet-dir
      - hostPath:
          path: /dev
          type: Directory
        name: host-dev
      - hostPath:
          path: /run/systemd
          type: DirectoryOrCreate
        name: host-run-systemd
      - hostPath:
          path: /sys
          type: Directory
        name: host-sys
      - emptyDir: {}
        name: cryptsetup-lock
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
apiVersion: v1
data:
  kubeletDir: /var/lib/kubelet
kind: ConfigMap
metadata:
  name: miami-deploy
  namespace: miami-system

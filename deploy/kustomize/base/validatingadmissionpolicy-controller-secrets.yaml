# Fences the one write of a Secret the controller gets: creating its own
# self-signed webhook certificate (self-signed mode; the cert-manager component
# removes both this policy and the controller's right to create Secrets).
#
# The controller's Role grants `create` on secrets in the driver's namespace,
# and RBAC cannot name an object that does not exist yet, so the grant is
# namespace-wide. Together with the `get` on the one named Secret that would
# let a compromised controller mint a ServiceAccount token: create a Secret of
# type kubernetes.io/service-account-token for any ServiceAccount of the
# namespace (while miami-webhook-tls is absent it could even read it back).
# This policy closes that: for the controller's ServiceAccount a Secret CREATE
# must carry the name miami-webhook-tls and the type kubernetes.io/tls, which
# is exactly what the controller creates (TLSSource, CreateSecret). Updates are
# not matched: the controller may only update the one named Secret by RBAC.
#
# The matchCondition names the ServiceAccount without its namespace, so an
# overlay that moves the driver to another namespace is still fenced, and it
# fences more, never less. A `namePrefix:` or `nameSuffix:` overlay renames the
# ServiceAccount: it MUST patch the matchCondition to the new name, as for the
# other policies. The Secret's name is a constant in the controller, not an
# object this kustomization names, so no overlay renames it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: miami-controller-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [secrets]
  matchConditions:
    - name: controller-only
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith(':miami-controller')
  validations:
    - reason: Forbidden
      message: "[name] the controller may create only the Secret miami-webhook-tls"
      expression: "object.metadata.name == 'miami-webhook-tls'"
    - reason: Forbidden
      message: "[type] the controller may create only a Secret of type kubernetes.io/tls"
      expression: "has(object.type) && object.type == 'kubernetes.io/tls'"

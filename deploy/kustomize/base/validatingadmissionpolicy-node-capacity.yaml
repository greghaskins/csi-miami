# Fences the one write the node plugin gets on a Node: its own node's cache
# capacity (design decision 66, 4.3 and 4.9). The plugin's ClusterRole grants
# `patch` on nodes/status, which RBAC cannot narrow to one node or one field;
# this policy does. It applies only to the plugin's own ServiceAccount (the
# matchCondition), so the kubelet, the control plane and every admin are not
# touched by it. For the plugin it requires all of:
#
#   [node-name]  the bound token's node-name is the node being updated, so a
#                compromised plugin on one node cannot write another's;
#   [capacity]   status.capacity differs from the old one in no key but the
#                cache resource (a key may be added, changed or removed);
#   [status]     every other field of status is unchanged;
#   [metadata]   so are labels, annotations, finalizers and ownerReferences
#                (the status endpoint resets spec, not metadata).
#
# [status] lists the fields of NodeStatus one by one, because CEL cannot
# compare "all of status but one key". TestNodeStatusFieldsCovered fails when
# the API gains a field this list lacks. A field a cluster's API does not have
# makes the expression fail to compile, and failurePolicy Fail then refuses the
# plugin's patch (the node advertises nothing; the stage check still runs on
# the flags' budget): the policy needs the node-name token extra (GA in 1.32)
# and declaredFeatures (1.35).
#
# The ServiceAccount name below is the base's namespace; an overlay that moves
# the driver to another namespace patches the matchCondition with it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: miami-node-capacity
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [UPDATE]
        resources: [nodes/status]
  matchConditions:
    - name: node-plugin-only
      expression: request.userInfo.username == 'system:serviceaccount:miami-system:miami-node'
  variables:
    - name: key
      expression: "'miami.csi.greghaskins.com/cache'"
    - name: newCap
      expression: "has(object.status.capacity) ? object.status.capacity : {}"
    - name: oldCap
      expression: "has(oldObject.status.capacity) ? oldObject.status.capacity : {}"
  validations:
    - reason: Forbidden
      message: "[node-name] the node plugin may update only the node its token is bound to"
      expression: >-
        has(request.userInfo.extra) &&
          'authentication.kubernetes.io/node-name' in request.userInfo.extra &&
          size(request.userInfo.extra['authentication.kubernetes.io/node-name']) == 1 &&
          request.userInfo.extra['authentication.kubernetes.io/node-name'][0] == object.metadata.name
    - reason: Forbidden
      message: "[capacity] the node plugin may change only the miami.csi.greghaskins.com/cache key of status.capacity"
      expression: >-
        variables.newCap.all(k, k == variables.key || (k in variables.oldCap && variables.oldCap[k] == variables.newCap[k])) &&
          variables.oldCap.all(k, k == variables.key || k in variables.newCap)
    - reason: Forbidden
      message: "[status] the node plugin may not change any field of status but capacity"
      expression: >-
        (has(object.status.allocatable) ? has(oldObject.status.allocatable) && object.status.allocatable == oldObject.status.allocatable : !has(oldObject.status.allocatable)) &&
          (has(object.status.phase) ? has(oldObject.status.phase) && object.status.phase == oldObject.status.phase : !has(oldObject.status.phase)) &&
          (has(object.status.conditions) ? has(oldObject.status.conditions) && object.status.conditions == oldObject.status.conditions : !has(oldObject.status.conditions)) &&
          (has(object.status.addresses) ? has(oldObject.status.addresses) && object.status.addresses == oldObject.status.addresses : !has(oldObject.status.addresses)) &&
          (has(object.status.daemonEndpoints) ? has(oldObject.status.daemonEndpoints) && object.status.daemonEndpoints == oldObject.status.daemonEndpoints : !has(oldObject.status.daemonEndpoints)) &&
          (has(object.status.nodeInfo) ? has(oldObject.status.nodeInfo) && object.status.nodeInfo == oldObject.status.nodeInfo : !has(oldObject.status.nodeInfo)) &&
          (has(object.status.images) ? has(oldObject.status.images) && object.status.images == oldObject.status.images : !has(oldObject.status.images)) &&
          (has(object.status.volumesInUse) ? has(oldObject.status.volumesInUse) && object.status.volumesInUse == oldObject.status.volumesInUse : !has(oldObject.status.volumesInUse)) &&
          (has(object.status.volumesAttached) ? has(oldObject.status.volumesAttached) && object.status.volumesAttached == oldObject.status.volumesAttached : !has(oldObject.status.volumesAttached)) &&
          (has(object.status.config) ? has(oldObject.status.config) && object.status.config == oldObject.status.config : !has(oldObject.status.config)) &&
          (has(object.status.runtimeHandlers) ? has(oldObject.status.runtimeHandlers) && object.status.runtimeHandlers == oldObject.status.runtimeHandlers : !has(oldObject.status.runtimeHandlers)) &&
          (has(object.status.features) ? has(oldObject.status.features) && object.status.features == oldObject.status.features : !has(oldObject.status.features)) &&
          (has(object.status.declaredFeatures) ? has(oldObject.status.declaredFeatures) && object.status.declaredFeatures == oldObject.status.declaredFeatures : !has(oldObject.status.declaredFeatures))
    - reason: Forbidden
      message: "[metadata] the node plugin may not change labels, annotations, finalizers or ownerReferences"
      expression: >-
        (has(object.metadata.labels) ? has(oldObject.metadata.labels) && object.metadata.labels == oldObject.metadata.labels : !has(oldObject.metadata.labels)) &&
          (has(object.metadata.annotations) ? has(oldObject.metadata.annotations) && object.metadata.annotations == oldObject.metadata.annotations : !has(oldObject.metadata.annotations)) &&
          (has(object.metadata.finalizers) ? has(oldObject.metadata.finalizers) && object.metadata.finalizers == oldObject.metadata.finalizers : !has(oldObject.metadata.finalizers)) &&
          (has(object.metadata.ownerReferences) ? has(oldObject.metadata.ownerReferences) && object.metadata.ownerReferences == oldObject.metadata.ownerReferences : !has(oldObject.metadata.ownerReferences))

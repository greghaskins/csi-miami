apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: miami.csi.greghaskins.com
spec:
  attachRequired: true
  podInfoOnMount: false
  # Applies fsGroup only to volumes with an fsType that are RWO or RWOP, so the
  # kubelet never chowns a directory item (no fsType). Immutable on a live
  # object (decision 27).
  fsGroupPolicy: ReadWriteOnceWithFSType
  volumeLifecycleModes:
    - Persistent
  requiresRepublish: false
  storageCapacity: false

# The driver's pods are privileged (node) or hold CAP_SYS_ADMIN on the host
# network (controller), so a cluster that enforces Pod Security Admission needs
# the privileged level here. Only enforce is set; warn and audit are the
# cluster's choice (an overlay may add them).
apiVersion: v1
kind: Namespace
metadata:
  name: miami-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest

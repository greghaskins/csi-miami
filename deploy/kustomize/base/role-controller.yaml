# Leader election for csi-provisioner, csi-attacher and csi-resizer. All take
# --leader-election-namespace=$(POD_NAMESPACE), so Leases are needed in the
# driver's namespace only; a cluster-wide grant would let a compromised
# controller container rewrite or delete any other component's leader lease.
#
# The webhook's self-signed certificate lives in the Secret miami-webhook-tls
# in this namespace: get and update are limited to that name. Creating it takes
# `create` without a name (Kubernetes cannot limit create by name), so that one
# verb covers Secrets in this namespace only. The cert-manager component removes
# create and update and keeps a get on the Secret cert-manager manages.
# deploy/policy_test.go holds this list.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miami-controller
  namespace: miami-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [miami-webhook-tls]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]

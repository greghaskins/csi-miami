# What the node binary's event recorder (internal/kube/events.go) does: it
# reads the PersistentVolume an event is about, and creates, reads and patches
# the event. The registrar and the liveness probe call no API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: miami-node
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, create, patch]

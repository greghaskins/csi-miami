# The node agent. The kubelet directory is one parameter: the KUBELET_DIR
# environment variable of the miami container. Every in-container path in the
# args derives from it through $(KUBELET_DIR), which Kubernetes expands in
# args, command and env. The three fields that cannot expand (this env value,
# the hostPath `path` and its `mountPath`) are set by one `replacements` entry
# in kustomization.yaml from the ConfigMap literal `kubeletDir`; the value
# written here is only what the replacement overwrites. The kubelet directory
# is mounted whole, so the CSI socket directory and the registry directory are
# subdirectories of that one mount; only the miami container mounts the whole
# directory (Bidirectional), the sidecars mount just the subPaths they use.
# deploy/policy_test.go fails if any
# occurrence disagrees.
#
# The miami container is privileged because the kubelet allows
# `Bidirectional` mount propagation only to privileged containers. It sets
# seccompProfile RuntimeDefault anyway; a runtime ignores the profile for a
# privileged container, and the API server accepts the combination.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: miami-node
  namespace: miami-system
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miami
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miami
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: miami-node
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: miami
          image: ghcr.io/greghaskins/csi-miami:unset
          args:
            - node
            - --endpoint=unix://$(KUBELET_DIR)/plugins/miami.csi.greghaskins.com/csi.sock
            - --node-id=$(NODE_NAME)
            - --kubelet-dir=$(KUBELET_DIR)
            - --metrics-addr=:9810
          env:
            - name: KUBELET_DIR
              value: /var/lib/kubelet
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9810
          livenessProbe:
            httpGet:
              path: /healthz
              # Served by the livenessprobe sidecar (a named port is per container).
              port: 9812
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=$(KUBELET_DIR)/plugins/miami.csi.greghaskins.com/csi.sock
            - --plugin-registration-path=/registration
            - --v=2
          env:
            - name: KUBELET_DIR
              value: /var/lib/kubelet
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Only the two subdirectories the registrar needs, not the whole
          # kubelet root. A subPath is relative to the volume root, so it needs
          # no expansion; the kubelet creates a missing one.
          volumeMounts:
            - name: kubelet-dir
              mountPath: /csi
              subPath: plugins/miami.csi.greghaskins.com
            - name: kubelet-dir
              mountPath: /registration
              subPath: plugins_registry
        - name: livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9812
            - --v=2
          ports:
            - name: healthz
              containerPort: 9812
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubelet-dir
              mountPath: /csi
              subPath: plugins/miami.csi.greghaskins.com
      volumes:
        # The kubelet's root, the one hostPath of the node. Under it live the
        # CSI socket (plugins/<driver>), the registry the registrar writes to
        # (plugins_registry), the node's intent store
        # (plugins/<driver>/intents, so a plugin restart keeps it) and the
        # transports root (plugins/<driver>/transports). The kubelet requires
        # its directory to be a shared mount, so a Bidirectional mount of it
        # propagates on every distribution; an arbitrary hostPath cannot
        # promise that.
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory

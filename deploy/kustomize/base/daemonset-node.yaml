# The node agent. The kubelet directory below (/var/lib/kubelet) is one
# literal that appears in: the miami container's --kubelet-dir, the registrar's
# --kubelet-registration-path, and the hostPaths and mount paths of the volumes.
# To change it, change every occurrence in this file; deploy/policy_test.go
# fails if they disagree.
#
# The miami container is privileged because the kubelet allows
# `Bidirectional` mount propagation only to privileged containers. It sets
# seccompProfile RuntimeDefault anyway; a runtime ignores the profile for a
# privileged container, and the API server accepts the combination.
#
# The transports root has no propagation (private to the plugin's mount
# namespace), on purpose: a transport mounted on the host table is, for NFS,
# a "reference" to every stage bind of the same export (the NFS client reports
# "/" as the root of all of them), and the kubelet then refuses to unstage the
# volume ("still mounted by other references"). The stage and publish binds are
# made under the kubelet directory, which does propagate, so they are on the
# host and survive a plugin restart; the transport is mounted again by the next
# plugin. Brief decision 26.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: miami-node
  namespace: miami-system
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miami
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miami
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: miami-node
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: miami
          image: ghcr.io/greghaskins/csi-miami:latest
          args:
            - node
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_NAME)
            - --kubelet-dir=/var/lib/kubelet
            - --transports-root=/var/lib/miami
            - --metrics-addr=:9810
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9810
          livenessProbe:
            httpGet:
              path: /healthz
              # Served by the livenessprobe sidecar (a named port is per container).
              port: 9812
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: transports
              mountPath: /var/lib/miami
              mountPropagation: None
            - name: plugin-dir
              mountPath: /csi
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/miami.csi.greghaskins.com/csi.sock
            - --v=2
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9812
            - --v=2
          ports:
            - name: healthz
              containerPort: 9812
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        # The kubelet's root. The node's intent store lives under it
        # (plugins/miami.csi.greghaskins.com/intents), so a plugin restart
        # keeps it.
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        # Where the plugin mounts its transports, private to its mount
        # namespace (see the top of this file). The directory itself is on the
        # host, so the mount points persist.
        - name: transports
          hostPath:
            path: /var/lib/miami
            type: DirectoryOrCreate
        # The CSI socket, where the kubelet and the registrar find it.
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/miami.csi.greghaskins.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory

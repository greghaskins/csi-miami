# The node agent. The kubelet directory is one parameter: the KUBELET_DIR
# environment variable of the miami container. Every in-container path in the
# args derives from it through $(KUBELET_DIR), which Kubernetes expands in
# args, command and env. The three fields that cannot expand (this env value,
# the hostPath `path` and its `mountPath`) are set by one `replacements` entry
# in kustomization.yaml from the ConfigMap literal `kubeletDir`; the value
# written here is only what the replacement overwrites. The kubelet directory
# is mounted whole, so the CSI socket directory and the registry directory are
# subdirectories of that one mount; only the miami container mounts the whole
# directory (Bidirectional), the sidecars mount just the subPaths they use.
# deploy/policy_test.go fails if any
# occurrence disagrees.
#
# The miami container is privileged because the kubelet allows
# `Bidirectional` mount propagation only to privileged containers. It sets
# seccompProfile RuntimeDefault anyway; a runtime ignores the profile for a
# privileged container, and the API server accepts the combination.
#
# The volume kind (ext4 over dm-crypt over an nbd device) needs more of the
# host than the directory kind. `privileged` already carries CAP_SYS_ADMIN
# (mount, the nbd netlink family, device-mapper ioctls, FIFREEZE) and a device
# cgroup that allows every device, so the security context is unchanged; what
# a container cannot get from a privileged flag alone is the host's /dev as it
# changes at runtime, the host's systemd socket and the host's sysfs, so those
# are three more hostPaths (below), each mounted at its own path in the miami
# container only. There is no hostPID (the block server of a volume runs as a
# systemd unit on the host) and no hostPath for the volume cache: it lives in
# the kubelet directory, the one mount the container already shares with the
# host (see `volumes`).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: miami-node
  namespace: miami-system
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miami
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miami
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: miami-node
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
                  - {key: node-role.kubernetes.io/master, operator: DoesNotExist}
      tolerations:
        - operator: Exists
      containers:
        - name: miami
          image: ghcr.io/greghaskins/csi-miami:unset
          args:
            - node
            - --endpoint=unix://$(KUBELET_DIR)/plugins/miami.csi.greghaskins.com/csi.sock
            - --node-id=$(NODE_NAME)
            - --kubelet-dir=$(KUBELET_DIR)
            - --metrics-addr=:9810
          env:
            - name: KUBELET_DIR
              value: /var/lib/kubelet
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9810
          livenessProbe:
            httpGet:
              path: /healthz
              # Served by the livenessprobe sidecar (a named port is per container).
              port: 9812
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            # The host's /dev. The nbd and device-mapper nodes (/dev/nbdN,
            # /dev/mapper/*, /dev/mapper/control) appear after the container
            # starts, so a copy of /dev taken at start would never show them:
            # HostToContainer makes new mounts and nodes under it visible. One
            # way only; nothing the container does under /dev reaches the host
            # as a mount.
            - name: host-dev
              mountPath: /dev
              mountPropagation: HostToContainer
            # systemd's private socket, /run/systemd/private, how the node
            # starts and stops each volume's block server as a transient unit.
            # Read-only is enough: connecting to a unix socket needs write
            # permission on the socket file, not a writable mount.
            - name: host-run-systemd
              mountPath: /run/systemd
              readOnly: true
            # The nbd devices' sysfs entries (/sys/block/nbdN, read for the
            # device index and the backend identifier). The node only reads it.
            - name: host-sys
              mountPath: /sys
              readOnly: true
            # cryptsetup keeps its locks for LUKS2 metadata in /run/cryptsetup
            # and fails a command with exit 5 and no message when it cannot
            # make that directory. The root file system is read-only, so the
            # directory is a volume of its own: container-local, not a
            # hostPath, and not shared with the host's cryptsetup. Only this
            # container runs cryptsetup (the block server never does), so a
            # lock directory per container is enough.
            - name: cryptsetup-lock
              mountPath: /run/cryptsetup
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=$(KUBELET_DIR)/plugins/miami.csi.greghaskins.com/csi.sock
            - --plugin-registration-path=/registration
            - --v=2
          env:
            - name: KUBELET_DIR
              value: /var/lib/kubelet
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Only the two subdirectories the registrar needs, not the whole
          # kubelet root. A subPath is relative to the volume root, so it needs
          # no expansion; the kubelet creates a missing one.
          volumeMounts:
            - name: kubelet-dir
              mountPath: /csi
              subPath: plugins/miami.csi.greghaskins.com
            - name: kubelet-dir
              mountPath: /registration
              subPath: plugins_registry
        - name: livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9812
            - --v=2
          ports:
            - name: healthz
              containerPort: 9812
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubelet-dir
              mountPath: /csi
              subPath: plugins/miami.csi.greghaskins.com
      volumes:
        # The kubelet's root, the one hostPath of the node. Under it live the
        # CSI socket (plugins/<driver>), the registry the registrar writes to
        # (plugins_registry), the node's intent store
        # (plugins/<driver>/intents, so a plugin restart keeps it) and the
        # transports root (plugins/<driver>/transports). The kubelet requires
        # its directory to be a shared mount, so a Bidirectional mount of it
        # propagates on every distribution; an arbitrary hostPath cannot
        # promise that. The volume kind's cache (plugins/<driver>/cache) and
        # the per-hash binary copies the block servers run
        # (plugins/<driver>/bin) are under it too, which is why the node needs
        # no hostPath of its own for them: the host's block server and the
        # container see the same absolute path.
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        # The volume kind's three further hostPaths, all for the miami
        # container alone (see its volumeMounts for what each is for).
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        # DirectoryOrCreate so a node without systemd still starts the pod and
        # serves the directory kind; the volume kind then refuses with the
        # systemd-socket prerequisite missing, as it does on any node whose
        # socket is absent.
        - name: host-run-systemd
          hostPath:
            path: /run/systemd
            type: DirectoryOrCreate
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: cryptsetup-lock
          emptyDir: {}

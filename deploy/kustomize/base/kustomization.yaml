# The driver's deployment, one resource per file. `kubectl apply -k` on this
# directory creates the namespace, the CSIDriver, the RBAC, the controller and
# the node DaemonSet, and no StorageClass (see ../examples).
#
# The kubelet directory is one parameter, the ConfigMap literal `kubeletDir`
# below (default /var/lib/kubelet). The `replacements` entry copies it into the
# node DaemonSet's KUBELET_DIR env values (the miami container and the
# registrar), the kubelet-dir hostPath and the miami container's mount path,
# the only fields Kubernetes cannot expand; everything else derives from
# KUBELET_DIR in the container args or is a subPath of the one volume. The controller needs none of
# this. The ConfigMap is also applied to the cluster; nothing reads it there.
#
# Kustomize runs a base's replacements while it builds the base, before an
# overlay's generators, so an overlay that merges a new literal must run the
# same replacement again over the merged value. The overlay writes no patch:
#
#   configMapGenerator:
#     - name: miami-deploy
#       namespace: miami-system
#       behavior: merge
#       literals:
#         - kubeletDir=/var/lib/k0s/kubelet
#   replacements:
#     - source: {kind: ConfigMap, name: miami-deploy, fieldPath: data.kubeletDir}
#       targets:
#         - select: {kind: DaemonSet, name: miami-node}
#           fieldPaths:
#             - spec.template.spec.containers.[name=miami].env.[name=KUBELET_DIR].value
#             - spec.template.spec.containers.[name=csi-node-driver-registrar].env.[name=KUBELET_DIR].value
#             - spec.template.spec.containers.[name=miami].volumeMounts.[name=kubelet-dir].mountPath
#             - spec.template.spec.volumes.[name=kubelet-dir].hostPath.path
#
# Both workloads carry a required node affinity that keeps them off nodes
# labelled node-role.kubernetes.io/control-plane or node-role.kubernetes.io/master
# (decision 35); the node DaemonSet still tolerates every taint, so custom
# taints on worker nodes do not keep the driver off. A cluster that wants the
# driver on control planes removes the affinity in its overlay:
#
#   patches:
#     - target: {kind: DaemonSet, name: miami-node}
#       patch: |-
#         - op: remove
#           path: /spec/template/spec/affinity
#     - target: {kind: Deployment, name: miami-controller}
#       patch: |-
#         - op: remove
#           path: /spec/template/spec/affinity
#
# Known roots: k0s /var/lib/k0s/kubelet, k3s /var/lib/rancher/k3s/agent/kubelet,
# microk8s /var/snap/microk8s/common/var/lib/kubelet.
#
# Minimum Kubernetes version: 1.32. The node plugin may patch nodes/status, and
# the ValidatingAdmissionPolicy that fences that patch to its own node and one
# capacity key needs VAP v1 (1.30) and the node-name token extra (1.32). On a
# cluster older than 1.30 the ClusterRole grant would land without its fence.
#
# The driver image is pinned at the end of this file: its content tag (r- and
# the hash of the input set .github/image.json names, computed by
# release-checks' content-tag.sh) and the digest of its multi-arch index. Every commit on main carries a pin for its own tree, kept
# current by `go run ./hack/pin pin` and verified by the `pin` check
# (docs/releasing.md). The render is ghcr.io/greghaskins/csi-miami:<tag>@<digest>,
# and the runtime pulls by the digest, so the privileged node DaemonSet never
# runs a mutable tag. An overlay may still set its own image with `images:`.
# The sidecar images carry a tag for the reader and the digest of the
# multi-arch index for the runtime.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - csidriver.yaml
  - serviceaccount-controller.yaml
  - serviceaccount-node.yaml
  - clusterrole-controller.yaml
  - clusterrole-node.yaml
  - validatingadmissionpolicy-node-capacity.yaml
  - validatingadmissionpolicybinding-node-capacity.yaml
  - validatingadmissionpolicy-controller-webhook-config.yaml
  - validatingadmissionpolicybinding-controller-webhook-config.yaml
  - validatingadmissionpolicy-controller-secrets.yaml
  - validatingadmissionpolicybinding-controller-secrets.yaml
  - clusterrolebinding-controller.yaml
  - role-controller.yaml
  - rolebinding-controller.yaml
  - clusterrolebinding-node.yaml
  - role-node.yaml
  - rolebinding-node.yaml
  - service-webhook.yaml
  - mutatingwebhookconfiguration-cache.yaml
  - deployment-controller.yaml
  - daemonset-node.yaml
configMapGenerator:
  - name: miami-deploy
    namespace: miami-system
    options:
      disableNameSuffixHash: true
    literals:
      - kubeletDir=/var/lib/kubelet
replacements:
  - source:
      kind: ConfigMap
      name: miami-deploy
      fieldPath: data.kubeletDir
    targets:
      - select:
          kind: DaemonSet
          name: miami-node
        fieldPaths:
          - spec.template.spec.containers.[name=miami].env.[name=KUBELET_DIR].value
          - spec.template.spec.containers.[name=csi-node-driver-registrar].env.[name=KUBELET_DIR].value
          - spec.template.spec.containers.[name=miami].volumeMounts.[name=kubelet-dir].mountPath
          - spec.template.spec.volumes.[name=kubelet-dir].hostPath.path
images:
  - name: ghcr.io/greghaskins/csi-miami
    newTag: r-28eaaab325ddab7287736347d9cfb04f45bba04faf4b981b4e2e5b2305284e64
    digest: sha256:840754be769fcac960305e6faf2678155a2a1b9f3d187154db7c3b22b7fb21a2

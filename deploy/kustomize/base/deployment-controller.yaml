# The controller: one replica, stateless (brief decision 2). Not privileged;
# CAP_SYS_ADMIN is for mount(2) of an nfs3 transport under its private
# /var/lib/miami. The sidecars run as root so they can connect to the driver's
# socket, which the driver creates as root.
#
# allowPrivilegeEscalation is false on every container. The nfs3 mount works
# with it: the kind e2e (T10) creates and deletes volume directories on a real
# kernel NFS export through this container's mount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miami-controller
  namespace: miami-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: miami
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miami
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: miami-controller
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
                  - {key: node-role.kubernetes.io/master, operator: DoesNotExist}
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: miami
          image: ghcr.io/greghaskins/csi-miami:unset
          args:
            - controller
            - --endpoint=unix:///csi/csi.sock
            - --transports-root=/var/lib/miami
            - --metrics-addr=:9811
          ports:
            - name: metrics
              containerPort: 9811
          livenessProbe:
            httpGet:
              path: /healthz
              # Served by the livenessprobe sidecar (a named port is per container).
              port: 9813
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            privileged: false
            runAsUser: 0
            # containerd's default AppArmor profile on Ubuntu denies mount(2)
            # even with CAP_SYS_ADMIN (decision 27).
            appArmorProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: [SYS_ADMIN]
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: transports
              mountPath: /var/lib/miami
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
          args:
            - --csi-address=/csi/csi.sock
            - --extra-create-metadata
            - --feature-gates=Topology=true
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            # A first CreateVolume on a transport pays for the NFS mount, which
            # the default 15s does not cover.
            - --timeout=60s
            - --v=2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0@sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --v=2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9813
            - --v=2
          ports:
            - name: healthz
              containerPort: 9813
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
        # The controller's transports root. It is private to the pod: nothing
        # in it survives a restart, and nothing needs to (brief decision 2).
        - name: transports
          emptyDir: {}

# Puts the policy of the same name in force: a policy with no binding enforces
# nothing, and the test suite fails a base that ships one without the other.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: miami-controller-webhook-config
spec:
  policyName: miami-controller-webhook-config
  validationActions: [Deny]

# A directory on the node's own disk. The path is on the node the pod runs on,
# so the class waits for a consumer to learn which node that is.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miami-local
provisioner: miami.csi.greghaskins.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  kind: directory
  transport.kind: local
  transport.path: /export/data
  # Optional: the mode of the volume's directory when the node creates it, as
  # up to four octal digits (default 0755), for example "0777" or "2775".
  # Upgrade every node plugin before setting mode.
  # mode: "0777"

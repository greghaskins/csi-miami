# Named miami-TYPE-LOCATION-SHARING[-CRYPT]: dir is a directory item, remote is
# a network server (NFSv3 today), rwx is many nodes. The crypt suffix is for M2.
# The server is an IPv4 address or a host name that resolves to one.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miami-dir-remote-rwx
provisioner: miami.csi.greghaskins.com
volumeBindingMode: Immediate
reclaimPolicy: Delete
parameters:
  kind: directory
  transport.kind: nfs3
  transport.server: 192.0.2.10
  transport.export: /export
  # Optional: a prefix under the export, one directory per namespace and claim.
  subdir: ${pvc.namespace}/${pvc.name}
  # Optional: the mode of the volume's directory when the driver creates it, as
  # up to four octal digits (default 0755). 0777 lets any user write, which is
  # what a pod needs on an export that squashes root to an unprivileged owner;
  # 2775 adds the setgid bit so new files take the directory's group. An
  # existing directory is adopted as it is and never chmod'ed. Setuid (a
  # leading 4 to 7) is refused. Upgrade every node plugin before setting mode.
  # mode: "0777"

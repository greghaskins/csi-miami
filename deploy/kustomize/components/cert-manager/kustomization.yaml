# Optional: let cert-manager issue the webhook's certificate instead of the
# controller. Add it to an overlay's `components:`; the base never depends on
# it, and cert-manager must be installed first.
#
#   components:
#     - ../../components/cert-manager
#
# What changes in the base:
# - the controller reads the Secret miami-webhook-tls-managed (cert-manager's,
#   with tls.crt, tls.key and ca.crt) and never writes a Secret;
# - its Secret create and update rights and its MutatingWebhookConfiguration
#   right are removed; a get on that one Secret stays;
# - cert-manager's cainjector writes the CA into the configuration (annotation);
# - the two policies that fence the controller's own writes, with their
#   bindings, are removed: its patch of that configuration (policy
#   miami-controller-webhook-config) and its creation of the self-signed
#   Secret (miami-controller-secrets). The controller has neither right left
#   for them to fence.
#
# certificate.yaml is cert-manager's usual bootstrap chain: a self-signed
# Issuer signs a long-lived CA Certificate, a CA Issuer built on it signs the
# serving Certificate, and the CA stays the same when the serving certificate
# renews. To use your own issuer, point the serving Certificate's issuerRef at
# it and drop the rest of the chain from certificate.yaml.
#
# caBundle is written by cert-manager's cainjector in this mode; a GitOps tool
# must ignore differences on it just as in the self-signed mode (README).
#
# The RBAC patches address rules by index, so each is guarded by `test` ops:
# a base (or an overlay below this component) that moved the rule makes the
# build fail instead of removing another rule.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - certificate.yaml
patches:
  - target: {kind: Deployment, name: miami-controller}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --webhook-tls-secret=miami-webhook-tls-managed
  - target: {kind: MutatingWebhookConfiguration, name: miami-cache}
    # A strategic-merge patch, so annotations an overlay put there stay. The
    # value names the driver's namespace as a literal; a `namespace:` overlay
    # must patch it (README, "Overlays that rename or move the driver").
    patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: miami-cache
        annotations:
          cert-manager.io/inject-ca-from: miami-system/miami-webhook
  - target: {kind: ValidatingAdmissionPolicy, name: miami-controller-webhook-config}
    patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: miami-controller-webhook-config
  - target: {kind: ValidatingAdmissionPolicyBinding, name: miami-controller-webhook-config}
    patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: miami-controller-webhook-config
  - target: {kind: ValidatingAdmissionPolicy, name: miami-controller-secrets}
    patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: miami-controller-secrets
  - target: {kind: ValidatingAdmissionPolicyBinding, name: miami-controller-secrets}
    patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: miami-controller-secrets
  # The configuration rule is the last one of the ClusterRole.
  - target: {kind: ClusterRole, name: miami-controller}
    patch: |-
      - op: test
        path: /rules/9/apiGroups
        value: [admissionregistration.k8s.io]
      - op: test
        path: /rules/9/resources
        value: [mutatingwebhookconfigurations]
      - op: test
        path: /rules/9/resourceNames
        value: [miami-cache]
      - op: remove
        path: /rules/9
  # Rules 1 and 2 of the Role are the Secret rules of the base.
  - target: {kind: Role, name: miami-controller}
    patch: |-
      - op: test
        path: /rules/1/apiGroups
        value: [""]
      - op: test
        path: /rules/1/resources
        value: [secrets]
      - op: test
        path: /rules/1/resourceNames
        value: [miami-webhook-tls]
      - op: test
        path: /rules/1/verbs
        value: [get, update]
      - op: test
        path: /rules/2/apiGroups
        value: [""]
      - op: test
        path: /rules/2/resources
        value: [secrets]
      - op: test
        path: /rules/2/verbs
        value: [create]
      - op: replace
        path: /rules/1
        value:
          apiGroups: [""]
          resources: [secrets]
          resourceNames: [miami-webhook-tls-managed]
          verbs: [get]
      - op: remove
        path: /rules/2
